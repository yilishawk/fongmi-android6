name: Android Release

# =============================================================================
# fongmi-android6 —— Android 6 (API 23) 分支的在线打包
#
# 产出 4 个 release APK（2 手机 + 2 电视，每个各含 arm64-v8a / armeabi-v7a）：
#   leanback-arm64_v8a-b6.apk      leanback-armeabi_v7a-b6.apk
#   mobile-arm64_v8a-b6.apk        mobile-armeabi_v7a-b6.apk
#
# 包名：com.fongmi.android.tv.b6（靠 -PcoexistSuffix 加后缀，不改包名重打包），
# 可与上游 webhtv（.tv）和上一代 webhtv-android6（.tv.a6）三者并存。
#
# ⚠ 签名是必需的：app/build.gradle 的 release 变体强制走 signingConfigs.release，
#   而 AbiApkPackaging 还会用 apksigner 二次对齐+签名，signingConfig 为空会直接 NPE。
#   因此必须在仓库 Secrets 里配好下面三个，否则本工作流会**显式报错退出**：
#     RELEASE_KEYSTORE_BASE64   keystore 的 base64（单行）
#     RELEASE_KEY_ALIAS         key alias
#     RELEASE_STORE_PASSWORD    store 密码（本工程 key 密码与 store 密码相同）
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      app_id_suffix:
        description: "共存后缀。留空=b6。只改 applicationId，不改 Java 类名，因此内置的 libplayer.so 仍能解析它的 JNI 回调类。填 b6 或 .b6 均可（会自动补点）"
        required: false
        default: b6
        type: string
      release_tag:
        description: "Release tag。留空 = v<versionName>-yyyyMMddHHmm 自动生成"
        required: false
        type: string
      release_notes:
        description: "Release 说明。用 \\n 表示换行"
        required: false
        type: string
      prerelease:
        description: "标记为 pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # gradle/gradle-daemon-jvm.properties 是给**本地开发者**用的 JVM 选择文件，
      # 内容是 toolchainVendor=JETBRAINS + toolchainVersion=21 + 一组 foojay 下载地址。
      # 在 CI 里它是纯负担：我们刚刚用 setup-java 明确装好了 Temurin 21，
      # 留着它会让 Gradle 认为"不满足条件"，转头去 foojay 再下一个 JetBrains JDK
      # （约 200MB，且依赖 foojay 的直链长期有效）。
      # 删掉后 Gradle 直接用启动它的那个 JVM，即 setup-java 装的 Temurin 21，行为确定。
      # 注意：只删 CI 工作区里的副本，仓库里的文件不动，本地开发不受影响。
      - name: Drop local-only daemon JVM criteria
        run: rm -f gradle/gradle-daemon-jvm.properties

      # 不用 android-actions/setup-android@v3：它在内部执行 `sdkmanager tools`，
      # 而 `tools` 这个包已从 SDK 仓库移除 ⇒ 报
      #     Warning: Failed to find package 'tools'
      #     Error: The process '.../sdkmanager' failed with exit code 1
      # （2026-09-29 run 36532372206 实测，15 秒即失败。）
      # ubuntu-latest runner 本身就预装了 Android SDK，直接用它自带的 sdkmanager 即可，
      # 少一个第三方 action 就少一个故障点。
      #
      # 要装的包必须与工程对齐，否则 Gradle 配置期就会失败：
      #   build-tools 36.0.0     —— AGP 9.3.1 的 MIN/DEFAULT_BUILD_TOOLS_REVISION
      #                             （已从 builder-9.3.1.jar 的 ToolsRevisionUtils 常量池核实）
      #   platforms;android-37.0 —— compileSdk/targetSdk = 37（注意包名带 .0）
      #   ndk 29.0.14206865      —— app/build.gradle 的 ndkVersion（编 libtvshim.so 垫片）
      #   cmake 3.22.1           —— app/build.gradle 的 cmake version
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error title=Android SDK not found::runner 上既没有 ANDROID_HOME 也没有 ANDROID_SDK_ROOT，或目录不存在"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK 目录 = $SDK"
          ls -1 "$SDK" || true

          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            # runner 上 cmdline-tools 的目录名是版本号（实测 16.0）而不是 latest，
            # 所以不能写死 cmdline-tools/latest/bin，用 find 兜底。
            SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error title=sdkmanager not found::在 $SDK/cmdline-tools 下找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager = $SDKMGR"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          "$SDKMGR" --version

      - name: Install Android packages
        run: |
          # 自动接受 SDK 许可，否则 sdkmanager 会卡在交互式 "Accept? (y/N)"
          yes | "$SDKMGR" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          echo "--- 安装结果 ---"
          ls -1 "$ANDROID_HOME/build-tools" || true
          ls -1 "$ANDROID_HOME/platforms" || true
          ls -1 "$ANDROID_HOME/ndk" || true
          # 断言关键组件真的落地了，避免后面报出难懂的错
          for D in "build-tools/36.0.0" "platforms/android-37.0" "ndk/29.0.14206865"; do
            if [ ! -d "$ANDROID_HOME/$D" ]; then
              echo "::error title=SDK component missing::缺 $ANDROID_HOME/$D"
              exit 1
            fi
          done
          echo "关键 SDK 组件齐全"

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error title=Cannot read versionName::app/build.gradle 里没解析到 versionName"
            exit 1
          fi

          # ---- 共存后缀归一化 ----------------------------------------------
          # app/build.gradle 把 -PcoexistSuffix 的值**原样**喂给 applicationIdSuffix，
          # 不做补点。所以这里统一补上前导点：b6 -> .b6，.b6 -> .b6。
          # 文件名后缀由 AbiApkPackaging.apkSuffix() 去掉前导点推导（.b6 -> -b6）。
          SUFFIX_RAW="$(printf '%s' '${{ inputs.app_id_suffix }}' | tr -cd 'A-Za-z0-9._-')"
          if [ -n "$SUFFIX_RAW" ]; then
            case "$SUFFIX_RAW" in
              .*) COEXIST_SUFFIX="$SUFFIX_RAW" ;;
              *)  COEXIST_SUFFIX=".$SUFFIX_RAW" ;;
            esac
            # 文件名后缀与包名后缀同源，只是去掉前导点：.b6 -> -b6
            APK_SUFFIX="-${COEXIST_SUFFIX#.}"
            APP_ID="com.fongmi.android.tv${COEXIST_SUFFIX}"
          else
            COEXIST_SUFFIX=""
            APK_SUFFIX=""
            APP_ID="com.fongmi.android.tv"
          fi

          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error title=Release tag exists::$TAG 已存在，换个 tag"
            exit 1
          fi

          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "title=${TAG#v}"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "coexist_suffix=$COEXIST_SUFFIX"
            echo "apk_suffix=$APK_SUFFIX"
            echo "app_id=$APP_ID"
          } >> "$GITHUB_OUTPUT"

          echo "包名 = $APP_ID"
          echo "tag  = $TAG"

      # 必须在任何 Gradle 调用之前完成：app/build.gradle 在**配置期**无条件读取
      # rootProject/local.properties，文件不存在会直接 FileNotFoundException。
      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "::error title=Release signing not configured::请在仓库 Settings > Secrets and variables > Actions 里配置 RELEASE_KEYSTORE_BASE64 / RELEASE_KEY_ALIAS / RELEASE_STORE_PASSWORD"
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/signing/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/signing/release.jks"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyPassword=$RELEASE_STORE_PASSWORD"
          } > local.properties
          echo "Release signing configured"

      - name: Build four release APKs
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk
          # 构建前的环境观测（只读，不参与构建）。
          # 2026-09-30 的两次 run 都在 packageXxxRelease 上失败/挂起，需要区分
          # "磁盘写满 / 内存不足 / worker 并发" 这几种可能 —— 光看 Task 日志区分不了。
          echo "--- 磁盘 ---"; df -h "$GITHUB_WORKSPACE" /tmp || true
          echo "--- 内存 ---"; free -m || true
          echo "--- CPU ---";  nproc || true
          # :app:assembleRelease 一次覆盖 2 flavor × 2 ABI = 4 个 APK。
          # （用 :app: 限定，避免根级 assembleRelease 顺带把 catvod/quickjs 的 release 变体也编一遍。）
          # ABI splits 由 buildSrc 的 AbiApkPackaging 无条件开启，universalApk=false。
          #
          # --stacktrace：run 36674838783 只报
          #   "A failure occurred while executing ...IncrementalSplitterRunnable"，
          #   **连 Caused by 都没有** ⇒ 根因被 AGP 吞了。
          #   那条 transform 就是 buildSrc 的 FinalizeApksTask（zipalign + apksigner）。
          #   注意：光靠 --stacktrace 还不够 —— 真正把现场留下来的是 FinalizeApksTask
          #   里新加的 dumpFailure()（重抛前把 abi / 文件大小 / 磁盘 / 堆 / 完整 cause 链
          #   打到 stderr）。
          #
          # 用 tee 而不是 `> file 2>&1`：重定向会让整个构建在 CI 日志里一行不输出，
          # 反而比改之前更难排查。tee 既保留 Task 级进度，又把完整日志留在
          # /tmp/gradle-build.log 供失败时上传。
          #
          # 刻意不开 --info：它对 8 分钟的构建会产生大量输出，有撑爆单 job 日志上限的
          # 风险。zipalign / apksigner 自己的报错已经由 FinalizeApksTask 直接转发到
          # 进程 stderr（见 align() / sign() 里的 errorOutput），不需要 --info。
          #
          # pipefail：GitHub Actions 的 bash 默认带 -eo pipefail，tee 不会吞掉 gradlew
          # 的退出码，失败时这一步照常变红。
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PcoexistSuffix='${{ steps.meta.outputs.coexist_suffix }}' \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle-build.log
          echo "构建成功。完整 Gradle 日志在 /tmp/gradle-build.log"

      # 构建失败时把完整 Gradle 日志传上来。
      # 之所以需要：失败现场在 runner 上，job 一结束就没了；而本地无法复现
      # （release 用的 keystore 来自 Secrets，沙箱里也跑不通 release）。
      # 只失败时上传 ⇒ 成功时零额外开销。
      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_id }}
          path: /tmp/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      # 断言：必须正好 4 个 APK，且 2 flavor × 2 ABI 齐全。少一个就大声失败，
      # 不允许"构建成功但产物不全"这种假通过。
      - name: Collect and assert artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          cp Release/apk/*.apk dist/ 2>/dev/null || true
          COUNT="$(ls -1 dist/*.apk 2>/dev/null | wc -l)"
          echo "收集到 $COUNT 个 APK："
          ls -lh dist/ || true
          if [ "$COUNT" != "4" ]; then
            echo "::error title=Unexpected APK count::期望 4 个 APK，实际 $COUNT 个"
            exit 1
          fi
          MISSING=""
          for DEV in leanback mobile; do
            for ABIF in arm64_v8a armeabi_v7a; do
              F="dist/${DEV}-${ABIF}${{ steps.meta.outputs.apk_suffix }}.apk"
              if [ ! -f "$F" ]; then
                MISSING="$MISSING $F"
              fi
            done
          done
          if [ -n "$MISSING" ]; then
            echo "::error title=Missing APK::缺少:$MISSING"
            exit 1
          fi
          echo "4 个 APK 齐全"

      # 断言产物**本身**是对的。这两条都不是预防性加码，而是已经真实发生过的失败模式：
      #   1) 包名必须是 .tv.b6 —— CI 忘了传 -PcoexistSuffix 就会出 .tv，与上游 webhtv 冲突
      #      （这是本分支共存方案的核心，见 app/build.gradle 的注释）
      #   2) 必须带 v1(JAR) 签名 —— v2 是 Android 7.0 才引入的，而本分支目标机是 Android 6，
      #      "Older platforms ignore v2 signatures and only verify v1 signatures"（AOSP 官方文档）
      #      2026-09-29 实测：FinalizeApksTask 原本写死 v1=false ⇒ apksigner 报
      #      DOES NOT VERIFY / Missing META-INF/MANIFEST.MF ⇒ 包装不上 Android 6
      #
      # 这里刻意不用 `grep -q` 收管道：本项目的校验脚本曾被 grep -q 的 SIGPIPE 坑出过"假通过"。
      # 按项目约定，先把输出取到变量，再用 bash case 做纯字符串匹配。
      - name: Verify package name and v1 signature
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          FAIL=0
          for A in dist/*.apk; do
            PKG="$("$BT/aapt2" dump badging "$A" 2>/dev/null | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            echo "--- $(basename "$A") ---"
            echo "    package = $PKG"
            if [ "$PKG" != "${{ steps.meta.outputs.app_id }}" ]; then
              echo "::error title=Wrong package name::$A 的包名是 '$PKG'，期望 '${{ steps.meta.outputs.app_id }}'"
              FAIL=1
            fi
            V="$("$BT/apksigner" verify --verbose "$A" 2>&1)"
            case "$V" in
              *"Verified using v1 scheme (JAR signing): true"*)
                echo "    v1 (JAR) 签名 = true" ;;
              *)
                echo "::error title=Missing v1 signature::$A 没有 v1(JAR) 签名，装不上 Android 6"
                echo "$V" | head -20
                FAIL=1 ;;
            esac
          done
          if [ "$FAIL" != "0" ]; then
            exit 1
          fi
          echo "✅ 4 个 APK 的包名与 v1 签名都正确"

      # 生成更新检测用的元数据，和 APK 一起放进 release。
      #
      # 内容就是 App 端 Updater.doInBackground() 读的三个字段：
      #   name -> 弹窗标题里的版本号（versionName）
      #   desc -> 弹窗正文（release notes）
      #   code -> 与 BuildConfig.VERSION_CODE 比较，只有更大才提示更新
      #
      # 资产名 <flavor>.json，App 端由 Github.getJson(BuildConfig.FLAVOR) 取，
      # 经 releases/latest/download/<flavor>.json 这个稳定别名访问。
      #
      # 用 python 而不是 printf/sed 生成：notes 里可能有引号、换行、反斜杠，
      # 手工拼 JSON 会生成非法文档，而 App 端解析失败是静默的（catch 掉），
      # 不会有人发现 —— 所以这里必须用真正的 JSON 序列化。
      - name: Generate update metadata
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APP_ID: ${{ steps.meta.outputs.app_id }}
          NOTES_RAW: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import json, os

          notes = os.environ["NOTES_RAW"].replace("\\n", "\n").strip()
          if not notes:
              notes = "Android 6 (API 23) 分支在线构建。包名：" + os.environ["APP_ID"]

          meta = {
              "name": os.environ["VERSION_NAME"],
              "desc": notes,
              "code": int(os.environ["VERSION_CODE"]),
          }

          for dev in ("leanback", "mobile"):
              path = os.path.join("dist", dev + ".json")
              with open(path, "w", encoding="utf-8") as fh:
                  json.dump(meta, fh, ensure_ascii=False, indent=2)
              print("生成", path, "->", meta["name"], "code", meta["code"])
          PY

          # 断言：两个 JSON 都要在，且必须能被解析。少一个或格式坏掉就大声失败，
          # 不允许"构建成功但元数据缺失"这种假通过。
          for DEV in leanback mobile; do
            F="dist/$DEV.json"
            if [ ! -s "$F" ]; then
              echo "::error title=Missing update metadata::$F 没生成或为空"
              exit 1
            fi
          done
          python3 -c "import json,sys; [json.load(open('dist/%s.json' % d, encoding='utf-8')) for d in ('leanback','mobile')]" \
            || { echo "::error title=Invalid update metadata::dist/*.json 不是合法 JSON"; exit 1; }
          echo "✅ leanback.json / mobile.json 已生成且可解析"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_RAW: ${{ inputs.release_notes }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES="$(printf '%s' "$RELEASE_NOTES_RAW" | sed 's/\\n/\n/g')"
          if [ -z "$NOTES" ]; then
            NOTES="Android 6 (API 23) 分支在线构建。包名：${{ steps.meta.outputs.app_id }}"
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG \
            dist/*.apk dist/*.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-android6-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
