import com.android.build.api.artifact.SingleArtifact
import com.fongmi.gradle.AbiApkPackaging

plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
rootProject.file('local.properties').withInputStream {
    localProps.load(it)
}

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()
    // Android 6 (API 23) 分支：只用来编 libtvshim.so（bionic 兼容垫片）。
    // 见 app/src/main/cpp/CMakeLists.txt 与 utils/NativeCompat.java。
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.fongmi.android.tv"
        // 共存：默认不加后缀，保持与原包同 applicationId；打包时传 -PcoexistSuffix=.b6
        // 即可让本构建以 com.fongmi.android.tv.b6 安装，与上游 webhtv（.tv）以及
        // 上一代 webhtv-android6 的包（.tv.a6）三者并存。
        // ⚠ 后缀是"显式传参才加"的，CI 不传 = 出的是 .tv，会与上游直接冲突。
        if (project.hasProperty('coexistSuffix') && project.getProperty('coexistSuffix').toString()) {
            applicationIdSuffix project.getProperty('coexistSuffix').toString()
        }
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        // 563 → 564（2026-09-30）→ 565（2026-10-01）→ 566（2026-10-02）→ 567（2026-10-02，图标/改名）
        // → 568（2026-10-02，修 API ≤ 23 装包链路）→ 569（2026-10-02，检测 json 也套加速前缀 + 失败可见）：
        // → 570（2026-10-04，VLC 接入：自写 media3 Player 适配层，作为**可选引擎**，默认不选）：
        // → 571（2026-10-04，VLC 取证版：修 AWindow「已 attach 再 setVideoView 必抛」的静默丢 surface，
        //    并把引擎选择 / attach 结果 / Vout 计数 / play 时序全部接进 DebugLogStore）：
        // App 内"检查更新"是拿远端 JSON 的 code 与 BuildConfig.VERSION_CODE 比大小，相等即判定"无需更新"。
        // 不抬的话 CI 产出的 dist/<flavor>.json 里 code 与已装包相同 ⇒ 比较恒为 false ⇒
        // 更新提示永不弹出（每次发版都必须递增）。
        // → 577（2026-10-06，回退 `--vout=android-display`（574/576 两轮实测均不可选），
        //    改为解码器自检日志）：
        // → 578（2026-10-06，探针 6：`--vout=android-opaque` —— 唯一变量，测 `.so` 里另一个
        //    Android 视频输出模块 `android-opaque` 是否可选；**实测失败并回退**：不在候选池 ×4129，
        //    且把硬解关掉（`MediaCodec via NDK opened=0`）、`count=1` 归零）：
        // → 579（2026-10-06，探针 7：删 `--vout=android-opaque` 回到 577 基线，唯一变量改为
        //    `--android-display-chroma=RV16`（等号形式）。**真机判读不成立**：4cc 仍 ANOP、画面仍黑
        //    ⇒ `--android-display-chroma` 对 `gles2` 无效，580 已删）：
        // → 580（2026-10-06，探针 8：`gles2`/libplacebo 色彩管线三选项。**判读无效**：三选项均进
        //    runtime、`Unknown option`=0，但 `gles2` 逐行无变化、`4cc` 仍 ANOP ⇒ 色彩映射假设不成立）：
        // → 581（2026-10-06，**根因修复，非探针**）：注册 `IVLCVout.OnNewVideoLayoutListener`
        //    （`VlcPlayer.attachViews(layoutListener)`）。根因 = VLC 原生 vout
        //    `android_display`(260)/`android_opaque`(280) 的 `Open()` 被
        //    `AWindowHandler_canSetVideoLayout()`（= `b_has_video_layout_listener`）静默挡掉，
        //    VLC 退到 `gles2` ⇒ 黑屏。唯一变量 = vout 路径；同时删掉 580 的三行探针（已证无效）
        //    回到 577 选项基线。回退 = 改回无参 `attachViews()`。
        //    判读全文：`.gradle-user/2026-10-06-根因定案-android-display门禁.md`
        // → 582（2026-10-06，**探针 9**）：`--vout=android-opaque,gles2`。
        //    581 真机判读（`.gradle-user/2026-10-06-581真机判读-第二道门禁.md`）证明 listener 修复
        //    **生效**（首次出现 `using opaque`，A/B：572/575/577 均为 0 次），但撞上**第二道门禁**：
        //    `android_opaque` 要求 app 提供**字幕 surface**，我们只有一个 ⇒
        //    `can't get Subtitles Surface` ⇒ `cannot blend subtitles with an opaque surface,
        //    trying next vout` ⇒ 让位 `gles2` ⇒ 仍黑。
        //    唯一变量 = 用 `--vout=` 把 `obj.force` 置 true（`core_modules.c:270`），从而跳过第二道门禁。
        //    ⚠ 探针代价：字幕失效（opaque 本来就混不了字幕）。**成功后须做「补字幕 surface」的根因修复。**
        //    ⚠ 发版必须 `-f release_tag=<名> -f prerelease=true`，不得顶掉 `releases/latest`。
        // → 583（2026-10-06，**真根因修复，非探针**）：给 media3 上报「首帧已渲染」。
        //    ⭐⭐⭐⭐⭐ 根因 = media3 `PlayerView` 的 `exo_shutter`（纯黑 `match_parent`、XML 里
        //    没写 visibility ⇒ 默认 VISIBLE）**从未被揭开**。`VlcPlayer` 是 `SimpleBasePlayer`
        //    子类，而 media3 只在子类置位 `State.Builder#setNewlyRenderedFirstFrame(true)` 时才派发
        //    `EVENT_RENDERED_FIRST_FRAME` ⇒ `PlayerView.onRenderedFirstFrame()` ⇒
        //    `shutterView.setVisibility(INVISIBLE)`（`PlayerView.java` 里**全类唯一**揭开点）。
        //    我们**从未调用过它** ⇒ 画面永远被黑幕盖住：有声音、零像素、连花屏/绿屏/一闪都没有。
        //    对照：mpv 有（`MpvVideoState.consumeFirstFrameEvent()` → `MpvStateBuilder`），
        //    EXO 由 `ExoPlayer` 内部自派发 —— 只有这条 VLC 适配层漏了。
        //    ⭐ 同时解释 582 判读：`event Vout: count=1` 实测 6 次、`videoSize=1080x608` 上报 6 次、
        //    解码器进 `COLOR_FormatSurface` 直通 ⇒ **渲染早就成功了，只是被盖住**。
        //    唯一变量 = `VlcPlayer` 加 2 个字段 + `refreshVideoSize()` 1 处置位 + `getState()` 1 处
        //    消费上报 + 2 处重置（`handleSetVideoOutput()` 新 surface 绑定 / `resetPlaybackState()`
        //    换媒体）—— media3 对「首次」的粒度定义含 "since setting the surface"，两个重置点**都必须
        //    覆盖**，否则 `PlayerView.closeShutter()` 重新盖上幕布后再也揭不开。
        //    **门禁①②/`--vout=`/解码/vout 全不动。**
        //    回退 = 删掉 `getState()` 里 `.setNewlyRenderedFirstFrame(consumeFirstFrame())` 一行。
        //    判读全文：`.gradle-user/2026-10-06-根因定案-media3黑幕未揭开.md`
        // → 584（2026-10-07，**真根因修复，非探针**）：让 VLC 适配层「定位到视轨」。
        //    ⭐⭐⭐⭐⭐ 根因 = `VlcPlayer.addGroup()` 建 media3 `Format` 时只填了
        //    `id / label / sampleMimeType`。`MediaPlayer.TrackDescription` **只有 id + name**
        //    （该 API 给不出编码/分辨率），而 media3-ui 的
        //    `DefaultTrackNameProvider.getTrackName()` 在**视频分支里完全不读 label**，
        //    只用「分辨率 + 帧率 + 码率」+ 末尾 `sampleMimeType` 的显示名
        //    ⇒ 每一项都渲染成 `video/x-unknown`，**看不出这是哪条视轨**。
        //    ⭐ 元数据一直在 `IMedia.getTrack(i)` 里（`VideoTrack{width,height,sarNum,sarDen,
        //    frameRateNum,frameRateDen}` / 基类 `{codec,bitrate,language,description}`），
        //    且**两边 id 空间一致**（`refreshVideoSize()` 早已 `video.id == getVideoTrack()` 匹配成功）。
        //    唯一变量 = `addGroup()` 改调新增的 `buildFormat()`，元数据取自 `IMedia.Track`；
        //    另加 `Event.Vout` 里一次 `refreshTracks()`（`event ES` 早于 `event Vout`，宽高要等 vout 建好）。
        //    ⭐ `MimeTypes.getMediaMimeType()` 只认 RFC 6381 串（`avc1.*`/`hev1.*`/`mp4a.xx`），
        //    **不认 libvlc 的 `"H264"`** ⇒ 自带 26 条小表 + 类型护栏（防把视轨算成音轨）。
        //    预期：视轨列表出现 `1080 × 608, 25 fps, H.264`（`video/avc` → 显示名 `H.264`）。
        //    ⚠ 连带：`TrackUtil.describeFormat()` 输出变了（多宽高/编码），而 `TrackUtil.find()`
        //    用它做**字符串匹配**存首选项 ⇒ 已存的音轨/字幕首选项会**失配一次**（回默认，不崩不清数据）。
        //    ⚠ **故意未动**（另行拍板）：①`id == -1` 幽灵项仍在列表（删它会让「视频组无选中项」
        //    成立 ⇒ `PlayerView.closeShutter()` 重盖黑幕）②`applyTrackSelection()` 无视频分支，
        //    且用 `getFormat(0)` 恒取伪轨 `-1` ⇒ `isAudioTrack(-1)` 命中 ⇒ `setAudioTrack(-1)` 关音频。
        //    **门禁①②/`--vout=`/解码/vout/首帧上报 全不动。**
        //    回退 = 单文件 `git checkout -- app/src/main/java/com/fongmi/android/tv/player/vlc/VlcPlayer.java`
        //    判读全文：`.gradle-user/2026-10-07-视轨定位修复-方案与实现.md`
        // → 585（2026-10-07，**放弃 VLC 引擎 —— 整体移除**）：
        //    ⭐ 决定：VLC（甲方案，570 接入）不再继续，连代码带依赖一并删掉。这不是"关入口"，
        //    是**彻底移除** —— 上面 570/571/577…584 那些 VLC 修复全部作废，仅作为历史保留。
        //    删了什么（完整清单见 commit message）：
        //      ① `app/src/main/java/com/fongmi/android/tv/player/vlc/` 整包 6 个文件
        //         （VlcPlayer / VlcPlayerEngine / VlcUtil / VlcLog / VlcProbe / VlcErrorMessageProvider）
        //      ② `PlayerEngine.Type.VLC`、`PlayerEngineFactory` 的 VLC 分支与 `createVlc()`/`isVlcReady()`
        //      ③ `PlayerSetting.ENGINE_VLC` 与 `isVlc()`；两处 `Math.clamp` 上界 `ENGINE_VLC` → `ENGINE_MPV`
        //      ④ `PlayerManager.isVlcEngine()`、`VideoSettingPanel.isVlc()`、
        //         `PlayerEngineDialog` 的 vlc chip、两个 `dialog_player_engine.xml` 的 vlc 按钮
        //      ⑤ `App.java` 的 `VlcProbe.run()` 探针调用、`R.array.select_engine` 的 VLC 项、
        //         `play_vlc` 字符串（values / zh-rCN / zh-rTW）
        //      ⑥ `implementation libs.libvlc.all`、`libs.versions.toml` 的 `libvlc`/`libvlc-all`、
        //         `proguard-rules.pro` 的 `-keep class org.videolan.**`
        //      ⑦ `.github/workflows/vlc-aar-probe.yml`
        //    ⭐ 为什么这是**良性**改动：**没有重排任何持久化序号** —— `ENGINE_EXO`/`ENGINE_MPV`
        //    仍是 0/1，`PlayerEngine.Type` 仍是 EXO/MPV。已存的 `player_engine == 2`（选过 VLC 的
        //    用户）会被 clamp 成 `1` ⇒ **自动回到 MPV**，不崩、不需要清数据。这正是 2026-10-04
        //    接入时就把 VLC 值追加在末尾所预留的回滚路径。
        //    ⭐ 体积收益（实测：解包 `.gradle-user/aar/libvlc-all-3.5.1.aar` 的 jni payload）：
        //      armeabi-v7a  未压缩 37.4 MB → 压缩后 ≈18.3 MB
        //      arm64-v8a    未压缩 41.3 MB → 压缩后 ≈18.6 MB
        //    ⇒ 每个 APK 预计少 ≈18 MB（584 实测 v7a 119.3 MB / arm64 134.9 MB）。
        //    ⚠ `packaging.jniLibs.pickFirsts("**/libc++_shared.so")` **保留**（理由见该处注释）。
        //    ⚠ `gradle.properties` 的 `-Xmx4096m` **保留**（当初因 VLC 体积顶破 2 GB 才抬的，
        //      但 4 APK 打包本身吃内存，降回去没有收益、只有风险）。
        //    回退 = `git revert` 585 的提交（依赖 / proguard keep / player/vlc 包一并还原）。
        versionCode 585
        versionName "5.6.3"
        externalNativeBuild {
            cmake {
                // 垫片自身只引用 API 23 就有的原语（fcntl / lseek64 / readv / writev /
                // prlimit64 / ioctl / fseeko）。平台号只影响编译链接期，不影响运行时；
                // 产物加载前会用 audit_sym_versions.py 对着 API-23 stub 复核一遍。
                arguments "-DANDROID_PLATFORM=android-26"
            }
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["device"]

    productFlavors {
        leanback {
            dimension "device"
        }
        mobile {
            dimension "device"
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        release {
            storeFile file(localProps['storeFile'])
            keyAlias localProps['keyAlias']
            keyPassword localProps['storePassword']
            storePassword localProps['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    // 2026-10-03 引入这条 pickFirst；2026-10-07（585）起**它唯一的理由已消失，但仍保留**。
    //
    // 起因：VLC（org.videolan.android:libvlc-all）与 media3-mpvplayer **各自**都随 AAR 带一份
    // libc++_shared.so，同名但内容不同：
    //     armeabi-v7a   VLC 554,808 B   vs   media3 963,028 B
    //     arm64-v8a     VLC 9,236,352 B vs   media3 1,374,336 B
    // mergeNativeLibs 会直接报重复文件而失败。⚠ 必须选 **media3 那一份**：逐符号比对过 5 个
    // 消费者的未定义符号（libvlc / libvlcjni / libmpv / libplayer / libavcodec，
    // 见 .gradle-user/VLC接入-门禁复验.md）—— media3 的 963,028 B 让 5 个消费者全部满足，
    // 而 VLC 那份让 libmpv 缺 23 个、libplayer 缺 1 个、libavcodec 缺 3 个
    // （std::to_chars/from_chars、bad_function_call vtable、iostream/filebuf vtable、
    //   __libcpp_verbose_abort）⇒ 选错会让 **MPV 静默全废**。
    //
    // 585 删掉 libvlc-all 之后，classpath 上只剩 media3 一家提供它 ⇒ 这条 pickFirst 已无实际作用。
    // **保留**的理由：① 一行配置、零副作用；② 若日后恢复 `nextlib-media3ext`（下面 dependencies
    // 里已注释掉的那行）会再次出现同名冲突 —— 那时没有它就是构建失败。
    packaging {
        jniLibs {
            // 用 .add(...) 而不是 += ：pickFirsts 是 Gradle 的 SetProperty<String>，
            // add() 在 Set / SetProperty 两种类型上都成立。
            pickFirsts.add("**/libc++_shared.so")
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

AbiApkPackaging.configure(project, SingleArtifact.APK.INSTANCE)

// 2026-09-28：排掉 io.antmedia:rtmp-client（RTMP 重复类）。
//
// 起因：我们自建并发布到 third_party/maven 的 media3-datasource-rtmp，其 .pom / .module
// 元数据里带着
//     io.antmedia:rtmp-client:3.2.0   (runtime)
// 而 FongMi 官方私有那份没有这条 —— 官方是用 app 侧显式声明的
//     com.github.mcxinyu:LibRtmp-Client-for-Android:v3.2.0.m2
// 来提供这些类的。我们重建 AAR 时把传递依赖带了回来，于是同一个 classpath 上出现两套
// 完全同名的类：
//     io.antmedia.rtmp_client.{RtmpClient, RtmpClient$RtmpIOException, RTMPMuxer, BuildConfig}
// 导致 :app:checkLeanbackDebugDuplicateClasses 失败。
//
// 证据（两个 AAR 都已实际解包核对）：
//   - 类集合完全相同，各 4 个；
//   - javap 逐成员比对 RtmpClient：无差异；
//   - AAR 条目结构相同，jni/ 下都是 arm64-v8a / armeabi-v7a / x86 / x86_64 四个
//     librtmp-jni.so；arm64-v8a 与 armeabi-v7a 大小一致但 md5 不同，
//     x86 / x86_64 连大小都不同 —— 同一源码用不同工具链重编，功能等价。
//
// 结论：两套可互换，保留**工程显式声明的那个**（mcxinyu fork），排掉传递来的官方那份。
// 之所以放在配置层而不是给依赖挂 exclude：media3 是以 `implementation libs.bundles.media3`
// 这个 bundle 引入的，bundle 不支持对单个成员挂 exclude。
// catvod / quickjs 不依赖 media3，故只需在这里排。
configurations.all {
    exclude group: "io.antmedia", module: "rtmp-client"
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation project(':catvod')
    // Python 引擎：预置运行时资产，不需要 Chaquopy 插件（见 settings.gradle / chaquo/build.gradle）
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation libs.appcompat
    implementation libs.lifecycle.service
    // 从 webhtv 移植：fongmi media3 fork（third_party/maven）+ mpvplayer 扩展
    implementation libs.bundles.media3
    // 2026-10-07（585）：VLC 引擎整体移除，`org.videolan.android:libvlc-all` 依赖已删除。
    //   实测体积收益（解包 .gradle-user/aar/libvlc-all-3.5.1.aar 的 jni payload）：
    //     armeabi-v7a  未压缩 37.4 MB → 压缩后 ≈18.3 MB
    //     arm64-v8a    未压缩 41.3 MB → 压缩后 ≈18.6 MB
    //   ⇒ 每个 APK 预计少 ≈18 MB（585 之前的实测值：v7a 119.3 MB / arm64 134.9 MB）。
    //   恢复方式 = `git revert` 585 的提交（依赖 / proguard keep / player/vlc 包一并还原）。
    // 2026-09-27 停用：nextlib-media3ext 是从 webhtv 一起带过来的，但 TV-fongmi 的源码
    // 对它零引用（全工程扫描：只有 build.gradle / libs.versions.toml / settings.gradle 提到名字，
    // app 与 catvod 的 .java 里一处都没有）。而它自带 jni/<abi>/{libavcodec,libavutil,
    // libswresample,libswscale}.so，会和我们补进 app/src/main/jniLibs 的 FFmpeg 库**同名冲突**
    // ——那批库是 libmpv.so 的 DT_NEEDED 依赖，必须是我们这一版（nextlib 的是精简版，
    // 实测缺 libavfilter/libavformat/libavdevice，libmpv.so 会有 136 个符号解析不了）。
    // 官方 5.6.6 APK 里也确实没有 libmedia3ext.so。要恢复把下面一行取消注释即可。
    // implementation libs.nextlib.media3ext
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.android.gif.drawable
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.rtmp.client
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
