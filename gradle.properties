# 2026-10-04：2 GB 堆在 :app:packageLeanbackRelease 上 OOM，见 run 37167419170。
# 栈是 java.lang.OutOfMemoryError: Java heap space @
#   com.android.zipflinger.Compressor.deflate → ApkFlinger.close
#   → PackageAndroidArtifact$IncrementalSplitterRunnable
# 注意：那次 CI 的 runner 有 16 GB RAM（构建前 free -m 打印 available 14619 MB），
# 所以瓶颈是 Gradle JVM 的堆上限，不是机器内存，也不是磁盘（86 G 可用）。
# 触发点：加了 VLC（libvlc-all）之后，每个 APK 多带 38–43 MB 的 libvlc.so，
# 打包期内存显著上升，2 GB 被顶破。
# ⚠ 2026-10-07（585）VLC 已整体移除，但这里**刻意不降回 2 GB**：当初的触发点消失了，
#   可「4 个 release APK 一起打包」本身就很吃内存（zipflinger 在 close 阶段全量 deflate），
#   降回去只有风险没有收益。-Xmx 是上限不是预留，本机内存小也不会因此变慢。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.caching=true
org.gradle.tooling.parallel=true
